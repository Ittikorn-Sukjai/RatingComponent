<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Rating Component</title>
</head>

<body>
  <div class="container">
    <div class="card bg-light rounded-4 border-0 shadow-lg mt-5">
      <div class="card-body">
        <div class="row p-5">
          <div class="col-7">
            <h2>What others think about the product</h2>
            <div>
            </div>
          </div>
          <div class="col-5">
            <div class="card">
              <div class="card-body text-center">
                <h3 class="display-5 fw-semibold"><i class="fa-solid fa-star text-warning"></i> 4.8</h3>
                <p>Average Rating</p>
              </div>
            </div>
          </div>
        </div>
        <!-- Search Reviews-->
        <div class="row">
          <div class="col-12">
            <div class="input-group input-group-lg rounded-5 overflow-hidden">
              <span class="input-group-text border-0">
                <i class="fa-solid fa-magnifying-glass"></i>
              </span>
              <input type="text" class="form-control border-0" placeholder="Search Reviews">
            </div>
          </div>
        </div>
        <!-- Rating Distribution-->
        <div class="row mt-4">
          <div class="col-12">
            <h4>Rating Distribution</h4>

            <div class="d-flex align-items-center gap-2 mb-2">
              <span>5</span>
              <i class="fa-solid fa-star text-warning"></i>
              <div class="progress flex-grow-1">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 80%" aria-valuenow="80"
                  aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="d-flex align-items-center gap-2 mb-2">
              <span>4</span>
              <i class="fa-solid fa-star text-warning"></i>
              <div class="progress flex-grow-1">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 15%" aria-valuenow="15"
                  aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="d-flex align-items-center gap-2 mb-2">
              <span>3</span>
              <i class="fa-solid fa-star text-warning"></i>
              <div class="progress flex-grow-1">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 5%" aria-valuenow="5"
                  aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="d-flex align-items-center gap-2 mb-2">
              <span>2</span>
              <i class="fa-solid fa-star text-warning"></i>
              <div class="progress flex-grow-1">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 3%" aria-valuenow="3"
                  aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

            <div class="d-flex align-items-center gap-2">
              <span>1</span>
              <i class="fa-solid fa-star text-warning"></i>
              <div class="progress flex-grow-1">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 1%" aria-valuenow="1"
                  aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>

          </div>
        </div>
        <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
